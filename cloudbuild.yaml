# CI/CD: test -> build -> push -> deploy (one trigger per environment/project).
#
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_ENV=dev,_REGION=europe-west4
#
# The deployer service account (Terraform output service_accounts.deployer) runs this build.
# Infrastructure changes go through `terraform plan/apply` (see infra/terraform/README.md);
# this pipeline only rolls new images onto the existing Cloud Run services.
substitutions:
  _ENV: dev
  _REGION: europe-west4
  _REPO: eap-${_ENV}-images

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # Postgres 16 + pgvector for the DDL / portability tests
  - id: postgres
    name: gcr.io/cloud-builders/docker
    args: ["run", "-d", "--name", "pg", "--network", "cloudbuild", "-e", "POSTGRES_USER=eap",
           "-e", "POSTGRES_PASSWORD=eap", "pgvector/pgvector:pg16"]

  - id: test
    name: python:3.12-slim
    waitFor: ["postgres"]
    env: ["EAP_TEST_PG_DSN=postgresql://eap:eap@pg:5432/postgres"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        pip install -q ./packages/eap_core[postgres] ./services/governor ./services/runtime pytest pytest-asyncio
        for i in $(seq 1 30); do python -c "import psycopg; psycopg.connect('$${EAP_TEST_PG_DSN}').close()" && break; sleep 2; done
        python -m pytest -q

  - id: build-governor
    name: gcr.io/cloud-builders/docker
    waitFor: ["test"]
    args: ["build", "-f", "services/governor/Dockerfile",
           "-t", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/governor:${SHORT_SHA}", "."]

  - id: build-runtime
    name: gcr.io/cloud-builders/docker
    waitFor: ["test"]
    args: ["build", "-f", "services/runtime/Dockerfile",
           "-t", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/runtime:${SHORT_SHA}", "."]

  - id: push
    name: gcr.io/cloud-builders/docker
    waitFor: ["build-governor", "build-runtime"]
    entrypoint: bash
    args:
      - -c
      - |
        docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/governor:${SHORT_SHA}
        docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/runtime:${SHORT_SHA}

  # Runtime first: it must understand any new bundle fields before the governor serves them.
  - id: deploy-runtime
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: ["push"]
    entrypoint: gcloud
    args: ["run", "services", "update", "eap-${_ENV}-runtime", "--region", "${_REGION}",
           "--image", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/runtime:${SHORT_SHA}"]

  - id: deploy-governor
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: ["deploy-runtime"]
    entrypoint: bash
    args:
      - -c
      - |
        for svc in eap-${_ENV}-governor-internal eap-${_ENV}-governor; do
          gcloud run services update $$svc --region ${_REGION} \
            --image ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/governor:${SHORT_SHA}
        done

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/governor:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/runtime:${SHORT_SHA}
