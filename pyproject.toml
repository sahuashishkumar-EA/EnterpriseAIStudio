[project]
name = "enterprise-agent-platform"
version = "0.1.0"
description = "Enterprise Agent Platform on GCP: Governor (control plane) + Agent Runtime (data plane)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::jwt.warnings.InsecureKeyLengthWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
