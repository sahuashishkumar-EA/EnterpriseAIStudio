# Local development: Postgres 16 + pgvector, governor (console on :8080), runtime (:8081),
# demo chat app (:8082).
# Dev auth (X-Dev-* headers), mock models, events pushed directly from governor to runtime.
#   docker compose up --build
#   python examples/seed.py --governor http://localhost:8080 --runtime http://localhost:8081
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: eap
      POSTGRES_PASSWORD: eap
      POSTGRES_DB: postgres
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/local/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eap"]
      interval: 2s
      retries: 30

  governor:
    build: {context: ., dockerfile: services/governor/Dockerfile}
    depends_on: {postgres: {condition: service_healthy}}
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgresql://governor:governor@postgres:5432/governor
      EAP_AUTH_MODES: dev
      EAP_RUNTIME_URL: http://runtime:8080
      EAP_RUNTIME_AUTH: dev
      EAP_EVENTS_PUSH_URLS: http://runtime:8080/internal/v1/events
      EAP_EVENTS_PUSH_DEV_USER: governor
      EAP_BOOTSTRAP_ADMINS: admin@example.com
      EAP_RELAXED_RELEASE: "true"
      EAP_CHAT_URL: http://localhost:8082/

  runtime:
    build: {context: ., dockerfile: services/runtime/Dockerfile}
    depends_on: {postgres: {condition: service_healthy}}
    ports: ["8081:8080"]
    environment:
      DATABASE_URL: postgresql://runtime:runtime@postgres:5432/runtime
      EAP_AUTH_MODES: dev
      EAP_GOVERNOR_URL: http://governor:8080
      EAP_GOVERNOR_AUTH: dev
      EAP_CALL_CONTEXT_KEY: local-dev-call-context-key-0123456789abcdef
      EAP_RESOLVER_TTL_S: "30"

  chat:
    build: {context: ., dockerfile: services/chat/Dockerfile}
    depends_on: [governor, runtime]
    ports: ["8082:8080"]
    environment:
      EAP_AUTH_MODES: dev
      EAP_CHAT_DEV_USER: admin@example.com
      EAP_GOVERNOR_URL: http://governor:8080
      EAP_RUNTIME_URL: http://runtime:8080
      EAP_UPSTREAM_AUTH: dev

  # ---- configuration-first platform (spec v1.0): docker compose --profile config up --build
  registry:
    profiles: ["config"]
    build: {context: ., dockerfile: services/launcher/Dockerfile}
    depends_on: {postgres: {condition: service_healthy}, opa: {condition: service_started}}
    ports: ["8090:8080"]
    environment:
      EAP_SERVICE: registry
      DATABASE_URL: postgresql://registry_owner:registry@postgres:5432/registry?options=-csearch_path%3Dregistry,public
      EAP_AUTH_MODES: dev
      EAP_OPA_URL: http://opa:8181
      EAP_EVENTS_PUSH_URLS: http://resolver:8080/internal/v1/events
      EAP_EVENTS_PUSH_DEV_USER: pubsub-push
      EAP_AUDIT_DIR: /tmp/eap-audit
      EAP_SECRET_MOCK_PLATFORM_TOKEN: local-dev-token
      EAP_MOCK_STATE_FILE: /tmp/eap-mock-platform.json

  resolver:
    profiles: ["config"]
    build: {context: ., dockerfile: services/launcher/Dockerfile}
    depends_on: [registry, valkey]
    ports: ["8091:8080"]
    environment:
      EAP_SERVICE: resolver
      EAP_AUTH_MODES: dev
      EAP_REGISTRY_URL: http://registry:8080
      EAP_REGISTRY_AUTH: dev
      EAP_VALKEY_URL: redis://valkey:6379/0
      EAP_LKG_DIR: /tmp/eap-lkg

  opa:
    profiles: ["config"]
    image: openpolicyagent/opa:latest-static
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    volumes: ["./policies:/policies:ro"]
    ports: ["8181:8181"]

  valkey:
    profiles: ["config"]
    image: valkey/valkey:8
    ports: ["6379:6379"]

volumes:
  pgdata:
