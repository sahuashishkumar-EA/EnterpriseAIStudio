[project]
name = "eap-governor"
version = "0.1.0"
description = "Enterprise Agent Platform - Governor (control plane + console)"
requires-python = ">=3.11"
dependencies = ["eap-core", "starlette>=0.37", "uvicorn[standard]>=0.29", "httpx>=0.27"]

[project.scripts]
eap-governor = "eap_governor.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["eap_governor"]

[tool.setuptools.package-data]
eap_governor = ["migrations/*.sql", "static/*"]
