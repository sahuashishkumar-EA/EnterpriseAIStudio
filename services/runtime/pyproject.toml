[project]
name = "eap-runtime"
version = "0.1.0"
description = "Enterprise Agent Platform - Agent Runtime (data plane)"
requires-python = ">=3.11"
dependencies = ["eap-core", "starlette>=0.37", "uvicorn[standard]>=0.29", "httpx>=0.27", "jsonschema>=4.21"]

[project.scripts]
eap-runtime = "eap_runtime.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["eap_runtime"]

[tool.setuptools.package-data]
eap_runtime = ["migrations/*.sql"]
